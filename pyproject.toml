[project]
name = "timur-backend"
version = "0.1.0"
description = ""
authors = [{ name = "tc-dev", email = "dev@togglecorp.com" }]
requires-python = "~=3.13.2"
readme = "README.md"
license = "GNU Affero General Public License v3.0"
dependencies = [
    "requests",
    "django-environ",
    "Django>=4.2,<4.3",
    "drf-writable-nested",
    "djangorestframework",
    "psycopg2-binary>=2.9,<3",
    "django-cors-headers",
    "django-premailer",
    "django-storages",
    "django-admin-autocomplete-filter",
    "strawberry-graphql-django==0.47.1",
    "sentry-sdk",
    "ipython",
    "factory-boy",
    "user-agents",
    "django-ses>=3,<4",
    "celery[redis]>=5.3.4,<6",
    "django-redis>=5.3.0,<6",
    "django-reversion",
    "uwsgi",
    "aws-sns-message-validator",
    "google-api-python-client",
    "django-health-check",
    "Pillow",
    "psutil",
    "django-admin-rangefilter",
]

[dependency-groups]
dev = [
    "dacite",
    "pytest",
    "pytest-profiling",
    "pytest-ordering",
    "pytest-django",
    "django-stubs==4.2.6",
    "djangorestframework-stubs",
    "celery-types",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "main.settings"
log_cli = true

[tool.black]
line-length = 125
# NOTE: Update in .pre-commit-config.yaml as well
extend-exclude = "(__pycache__|.*snap_test_.*\\.py|.+\\/.+\\/migrations\\/.*)"

[tool.isort]
profile = "black"
multi_line_output = 3
skip = [
    "**/__pycache__",
    "**/snap_test_*.py",
    ".venv/",
    "**/migrations/*.py",
]

[tool.pyright]
exclude = [
    "**/__pycache__",
    "**/snap_test_*.py",
    ".venv/",
    "**/migrations/*.py",
]
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
