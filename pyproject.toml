[project]
name = "timur-backend"
version = "0.3.1"  # managed by release.sh
description = ""
authors = [{ name = "tc-dev", email = "dev@togglecorp.com" }]
requires-python = "~=3.13.2"
readme = "README.md"
license = "GNU Affero General Public License v3.0"
dependencies = [
    "requests",
    "django-environ",
    "Django>=4.2,<4.3",
    "drf-writable-nested",
    "djangorestframework",
    "psycopg2-binary>=2.9,<3",
    "django-cors-headers",
    "django-premailer",
    "django-storages",
    "django-admin-autocomplete-filter",
    "strawberry-graphql-django==0.89.0",
    "sentry-sdk",
    "ipython",
    "factory-boy",
    "user-agents",
    "django-ses>=3,<4",
    "celery[redis]>=5.3.4,<6",
    "django-redis>=5.3.0,<6",
    "django-reversion",
    "uwsgi",
    "aws-sns-message-validator",
    "google-api-python-client",
    # NOTE: pinned to the latest 3.x; 4.x is a breaking async rewrite that drops the
    # migrations/disk checks and the HEALTH_CHECK settings this project uses.
    "django-health-check==3.24.0",
    "Pillow",
    "psutil==7.2.2",
    "django-admin-rangefilter",
    "django-allauth[socialaccount]",
    "djangoql", # Admin panel query search
    "python-ulid",
    "slack_sdk",
    "pyyaml",
    "banjo-utils",
]

[dependency-groups]
dev = [
    "dacite",
    "pytest",
    "pytest-profiling",
    "pytest-ordering",
    "pytest-django",
    "django-stubs==4.2.6",
    "djangorestframework-stubs",
    "google-api-python-client-stubs",
    "celery-types",
    "colorlog",
]

[tool.uv]
package = false

[tool.uv.sources]
banjo-utils = { git = "https://github.com/toggle-corp/banjo-utils", tag = "v0.2.0" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "main.settings"
log_cli = true

[tool.pyright]
exclude = [
    "**/__pycache__",
    "**/snap_test_*.py",
    ".venv/",
    "**/migrations/*.py",
]
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
strictDictionaryInference = true
strictListInteference = true
strictSetInference = true
reportImplicitOverride = true

[tool.ruff]
line-length = 125
extend-exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    "**/migrations/*",
    "__pycache__",
]

[tool.ruff.lint]
flake8-builtins.builtins-strict-checking = false
ignore = [
    "C901",
    "E701",
    "E203",
    "DJ001",
    "G201",
    "SIM108",
]
extend-select = ["I", "E", "F", "B", "A", "W", "DJ", "AIR", "COM", "INT", "ISC", "ICN", "LOG", "G", "T20", "TID", "PT", "Q", "RET", "SIM", "TC", "PTH", "UP"]
# TODO: Use this instead `select = ["ALL"]` and add rules to ignore
#   ruff check --statistics ./

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/**/mutations.py" = ["B006"]
"utils/strawberry/*.py" = ["UP"]
"/**/tests/*_mock_data.py" = ["E501"]
"**/snap_test_*.py" = ["E501"]

[tool.coverage.report]
# https://coverage.readthedocs.io/en/7.10.6/excluding.html#advanced-exclusion
exclude_also = [
    "raise NotImplementedError",
    "if typing.TYPE_CHECKING:",
]
partial_branches = [
    "if typing.TYPE_CHECKING:",
]
