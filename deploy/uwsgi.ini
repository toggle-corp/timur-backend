[uwsgi]

chdir = /code/
module = main.wsgi

master = true
processes = 10
# Refuse to boot if the WSGI app fails to import (missing env, settings error, etc.)
# instead of staying up and answering every request with "no python application found".
# A failed import then crashes the container so the readiness probe never passes and
# the rollout fails loudly, rather than serving 500s from a "running" pod.
need-app = true
http = 0.0.0.0:80
chmod = 666

vacuum = true
harakiri = 60

# Skip access logging for liveness/readiness probes — they fire every few seconds.
# Caveat: uWSGI's `donotlog` is unconditional, so this also suppresses error responses (5xx) on these routes.
# NOTE: trailing `/?` matches the banjo probe URLs (/healthz/live/, /healthz/ready/), which carry a trailing slash.
route = ^/healthz/(live|ready)/?$ donotlog:
