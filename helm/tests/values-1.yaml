app:
  environment: Alpha
  # Global Image
  image:
    name: ghcr.io/toggle-corp/timur-backend-alpha
    tag: feature-helm.c1234

  ingress:
    enabled: true
    className: nginx
    host: timur-api.example.com

  redis:
    master:
      persistence:
        size: .5Gi
        storageClass: longhorn

  postgresql:
    enabled: true
    auth:
      postgresPassword: "pg-postgres-secure-password"
      username: "timur"
      password: "pg-timur-secure-password"
      database: "timur"
    primary:
      persistence:
        storageClass: "longhorn"
        size: 1Gi

  minio:
    enabled: true
    global:
      defaultStorageClass: longhorn
    apiIngress:
      enabled: true
      ingressClassName: nginx
      hostname: timur-minio.example.com
    auth:
      rootUser: timur
      rootPassword: minio-timur-secure-password
    persistence:
      enabled: true
      size: 0.5Gi

  api:
    resources:
      requests:
        cpu: "0.1"
        memory: 0.5Gi

  argoHook:
    enabled: false

  # NOTE: Check main/settings.py for all available options
  env:
    AWS_S3_ENABLED: "true"
    # App Domain
    APP_DOMAIN: https://timur-api.example.com
    APP_FRONTEND_HOST: https://timur.example.com
    SESSION_COOKIE_DOMAIN: .example.com
    CSRF_COOKIE_DOMAIN: .example.com
    # Email
    EMAIL_FROM: "timur.example.com"
    # Google SSO
    GOOGLE_OAUTH_ENABLED: "true"

  # NOTE: Check main/settings.py for all available options
  secrets:
    DJANGO_SECRET_KEY: "SECURE_DJANGO_SECRET_KEY"
    # Google calendar
    GOOGLE_CALENDAR_ID: long-dynamic-id@group.calendar.google.com
    GOOGLE_CREDENTIALS_B64_GZ: SUPER_SECURE_GOOGLE_CREDENTIALS_B64_GZ
    # Sentry
    SENTRY_DSN: https://test-123@sentry.example/27
    # Google SSO
    GOOGLE_OAUTH_CLIENT_ID: another-long-dynamic-id.apps.googleusercontent.com
    GOOGLE_OAUTH_REDIRECT_URL: https://timur-api.example/o/google
