app:
  environment: ALPHA

  api:
    ingress:
      enabled: true
      host: timur-api.example.com

  env:
    APP_DOMAIN: https://timur-api.example.com
    APP_FRONTEND_HOST: https://timur.example.com
    # App Domain
    SESSION_COOKIE_DOMAIN: .example.com
    CSRF_COOKIE_DOMAIN: .example.com
    # Email
    EMAIL_FROM: "timur@example.com"
    # Sentry
    SENTRY_ENABLED: "true"
    # Google SSO
    GOOGLE_SSO_ENABLED: "true"
    # Calendar
    GOOGLE_CALENDAR_INCLUDE_DEBUG_IN_EVENT: "true"
    # Standup
    DAILY_STANDUP_DOCUMENTATION_REF: "<https://notes.example.com/XYX?view|Documentation>"
    DAILY_STANDUP_MEET_LINK: "https://meet.google.com/XYZ"
    # AWS (S3) — dummy bucket names for snapshot rendering (real names per-environment)
    AWS_S3_MEDIA_BUCKET_NAME: "example-media"
    AWS_S3_STATIC_BUCKET_NAME: "example-static"

  # NOTE: Check main/settings.py for all available options
  secrets:
    DJANGO_SECRET_KEY: "SECURE_DJANGO_SECRET_KEY"
    # Google calendar
    GOOGLE_CALENDAR_ID: long-dynamic-id@group.calendar.google.com
    GOOGLE_CREDENTIALS_B64_GZ: SUPER_SECURE_GOOGLE_CREDENTIALS_B64_GZ
    # Sentry
    SENTRY_DSN: https://test-123@sentry.example/27
    # Google SSO
    GOOGLE_OAUTH_CLIENT_ID: another-long-dynamic-id.apps.googleusercontent.com
    GOOGLE_OAUTH_REDIRECT_URL: https://timur-api.example/o/google
