apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-pg
spec:
  backup: {}
  enablePDB: true
  instances: 3
  monitoring:
    enablePodMonitor: true
  plugins:
  - enabled: true
    isWALArchiver: true
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: aws-s3-store
  storage:
    size: 1Gi
