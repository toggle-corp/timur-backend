# Source: timur-backend-helm/charts/app/templates/extraManifests.yaml
# Manifest: dragonflydb-cluster
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  labels:
    app.kubernetes.io/name: dragonfly
  name: timur-dragonfly
spec:
  args:
  - --dbfilename=mainSnapshot
  replicas: 2
  resources:
    limits:
      cpu: "1"
      memory: 500Mi
    requests:
      cpu: "0.1"
      memory: 256Mi
  snapshot:
    cron: '*/5 * * * *'
    persistentVolumeClaimSpec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

