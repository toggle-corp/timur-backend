# Manifest: cnpg-s3-credential
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: aws-s3-store
spec:
  configuration:
    s3Credentials:
      accessKeyId:
        key: ACCESS_KEY_ID
        name: cnpg-barman-s3-creds
      secretAccessKey:
        key: ACCESS_SECRET_KEY
        name: cnpg-barman-s3-creds
    wal:
      compression: gzip
      maxParallel: 4
  retentionPolicy: 30d
