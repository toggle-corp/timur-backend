app:
  environment: PROD
  # Short base name for all generated resources. Keeps CronJob names well under the
  # 52-char cap (k8s appends a timestamp to spawn Jobs, which must stay <= 63 chars);
  # without it the release-name-prefixed cronjobs would hit the limit.
  fullnameOverride: "timur"
  # settings.py reads the process role from DJANGO_APP_TYPE (Sentry app_type tag);
  # the chart injects it per component via appTypeEnvName - never hardcode the role.
  appTypeEnvName: "DJANGO_APP_TYPE"
  # Global Image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  api:
    enabled: true
    containerPort: 80
    command: ["/code/scripts/deploy/run_web.sh"]
    probes:
      enabled: true  # chart defaults: liveness /healthz/live/, readiness+startup /healthz/ready/
    ingress:
      enabled: true
      # className left blank - the cluster's default IngressClass is used.
      className:
      host:
    resources:
      requests:
        cpu: "2"
        memory: 0.5Gi
      limits:
        memory: 1Gi

  worker:
    enabled: false

  hooks:
    enabled: true
    defaults:
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          memory: 2Gi
    jobs:
      # NOTE: Make sure keys are lowercase.
      # db-migrate and collect-static inherit the chart defaults (Sync hook @ wave 20).
      # wait-for-resources (Sync hook @ wave 10) gates api on connectivity.
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache"]

  cronjobs:
    enabled: true
    defaults:
      resources:
        requests:
          cpu: "0.1"
          memory: 0.5Gi
        limits:
          memory: 1Gi
    # NOTE: job keys here are kept in sync with main/sentry.py SentryMonitorConfig.CronJob.
    jobs:
      process_not_done_time_entries:
        enabled: true
        schedule: "5 0 * * *"  # Every day at 0:5
        timeZone: "Asia/Kathmandu"
        command: ["./manage.py", "process_not_done_time_entries"]
      clearsessions:
        enabled: true
        schedule: "0 0 1 * *"  # once-a-month
        timeZone: "Asia/Kathmandu"
        command: ["./manage.py", "clearsessions"]
      # TODO: Add force sync calendar events (Every month)
      user_sync_slack_users_id:
        enabled: true
        schedule: "30 16 * * 1,2,3,4,5"  # Before standup_setup_next_standup
        timeZone: "Asia/Kathmandu"
        command: ["./manage.py", "sync_slack_users_id"]
      # Daily standup - subcommands
      standup_morning_reminder:
        enabled: true
        schedule: "0 8 * * 1,2,3,4,5"
        timeZone: "Asia/Kathmandu"
        command: ["./manage.py", "standup", "morning-reminder"]
      standup_before_standup_reminder:
        enabled: true
        schedule: "10 9 * * 1,2,3,4,5"
        timeZone: "Asia/Kathmandu"
        command: ["./manage.py", "standup", "before-standup-reminder"]
      standup_setup_next_standup:
        enabled: true
        schedule: "45 16 * * 1,2,3,4,5"
        timeZone: "Asia/Kathmandu"
        command: ["./manage.py", "standup", "setup-next-standup"]
      standup_read_doc_reminder:
        enabled: true
        schedule: "55 16 * * 1,2,3,4,5"
        timeZone: "Asia/Kathmandu"
        command: ["./manage.py", "standup", "read-doc-reminder"]

  # NOTE: Check main/settings.py for all available options.
  # APP_DOMAIN, APP_FRONTEND_HOST, SESSION_COOKIE_DOMAIN, CSRF_COOKIE_DOMAIN and
  # EMAIL_FROM are provided per-environment (env overlays / CICD).
  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    DJANGO_TIME_ZONE: "Asia/Kathmandu"
    DJANGO_DEBUG: "false"
    SESSION_COOKIE_AGE: "2592000"  # 30 days
    # -- Sentry
    SENTRY_TRACES_SAMPLE_RATE: "0.2"
    SENTRY_PROFILE_SAMPLE_RATE: "0.2"
    # -- Google SSO
    GOOGLE_SSO_ENABLED: "false"
    # GOOGLE_SSO_ALLOWED_DOMAINS: togglecorp.com
    # -- AWS
    # Default ENABLED so media/static use S3, not the pod's ephemeral filesystem.
    # Endpoint/bucket names + credentials are provided per-environment (CICD / ExternalSecret).
    AWS_S3_ENABLED: "true"
    # AWS_S3_ENDPOINT_URL:
    # AWS_S3_MEDIA_BUCKET_NAME:
    # AWS_S3_STATIC_BUCKET_NAME:

  # NOTE: Check main/settings.py for all available options.
  # Secrets are provided per-environment (env overlays / CICD / ExternalSecret).
  secrets: {}
